<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExpressPay — Scheduled maintenance (Option B)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-serbisyo: #ee2434; --color-panatag: #1c4199; --color-pag-asa: #4fbff7;
      --color-tapat: #fbfbfb; --color-sistema: #e5e5e5;
      --font-heading: "Montserrat", system-ui, sans-serif;
      --font-body: "DM Sans", system-ui, sans-serif;
    }
  </style>
</head>
<!-- Option B: full-bleed Panatag navy, giant numerals, progress bar through the night window. Bold, "night mode". -->
<body class="min-h-screen bg-panatag font-body text-white flex flex-col">
  <header class="px-6 py-5 sm:px-10">
    <svg class="h-8" viewBox="0 0 280 64" role="img" aria-label="ExpressPay">
      <text x="0" y="48" font-family="Montserrat" font-weight="800" font-size="44" letter-spacing="-1"><tspan fill="#ffffff">Express</tspan><tspan fill="#4fbff7">Pay</tspan></text>
      <text x="252" y="20" font-family="Montserrat" font-weight="600" font-size="13" fill="#4fbff7">™</text>
    </svg>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center px-4 text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-pag-asa">Nightly maintenance in progress</p>
    <h1 class="mt-3 font-heading text-3xl sm:text-4xl font-bold">The portal is resting. Back at 6:45 AM.</h1>

    <div class="mt-10 flex items-baseline gap-2 sm:gap-4 font-heading font-extrabold tabular-nums" aria-live="polite">
      <span id="h" class="text-6xl sm:text-8xl">--</span><span class="text-4xl sm:text-6xl text-serbisyo">:</span>
      <span id="m" class="text-6xl sm:text-8xl">--</span><span class="text-4xl sm:text-6xl text-serbisyo">:</span>
      <span id="s" class="text-6xl sm:text-8xl text-pag-asa">--</span>
    </div>
    <div class="mt-2 flex gap-16 sm:gap-28 text-[11px] uppercase tracking-widest text-white/50"><span>hrs</span><span>min</span><span>sec</span></div>

    <div class="mt-12 w-full max-w-lg">
      <div class="h-2 rounded-full bg-white/15 overflow-hidden">
        <div id="bar" class="h-full rounded-full bg-gradient-to-r from-serbisyo to-pag-asa transition-[width] duration-1000" style="width:0%"></div>
      </div>
      <div class="mt-2 flex justify-between text-xs text-white/60"><span>10:30 PM</span><span>6:45 AM</span></div>
    </div>
  </main>

  <footer class="px-6 py-5 sm:px-10 flex flex-col sm:flex-row justify-between gap-1 text-xs text-white/50">
    <span>Your account and transactions are safe.</span>
    <span>Error 403 · Philippine time (UTC+8)</span>
  </footer>
  <div id="sim" class="hidden fixed bottom-3 right-3 rounded bg-black/70 px-2 py-1 text-[11px]">Mockup: simulating 1:23 AM</div>
  <script src="countdown.js"></script>
  <script>
    startCountdown((t) => {
      h.textContent = t.h; m.textContent = t.m; s.textContent = t.s;
      bar.style.width = (t.progress * 100).toFixed(2) + "%";
      sim.classList.toggle("hidden", !t.simulated);
    });
  </script>
</body>
</html>
