name: Deploy to S3

# Builds the page and uploads dist/ to s3://$S3_BUCKET/maintenance/.
# AWS auth is via GitHub OIDC -> expresspay-downtime-github-deploy role (see kos/aws-setup.md).

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The role's trust policy also only allows master; this fails earlier with a clearer message.
      - name: Only deploy from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Deploys run from master only (got ${GITHUB_REF})."
          exit 1

      - name: Check repo variables
        if: vars.AWS_DEPLOY_ROLE_ARN == '' || vars.S3_BUCKET == ''
        run: |
          echo "::error::Set AWS_DEPLOY_ROLE_ARN and S3_BUCKET in Settings → Variables (see kos/aws-setup.md)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets first, so the new index.html never points at files that aren't uploaded yet.
      - name: Upload hashed assets
        run: >-
          aws s3 sync dist/assets "s3://${S3_BUCKET}/maintenance/assets"
          --cache-control "public,max-age=31536000,immutable"

      # Unhashed files must revalidate so a new deploy shows up immediately.
      - name: Upload index.html and pattern
        run: >-
          aws s3 sync dist "s3://${S3_BUCKET}/maintenance"
          --exclude "assets/*"
          --cache-control "no-cache"

      # Everything is already uploaded; this only removes old hashed assets.
      - name: Remove stale files
        run: aws s3 sync dist "s3://${S3_BUCKET}/maintenance" --delete --size-only

      - name: Invalidate CloudFront
        id: invalidate
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/maintenance/index.html" "/maintenance/banig-pattern.svg" \
            --query Invalidation.Id --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA::12}\` to \`s3://${S3_BUCKET}/maintenance/\`"
            echo '```'
            find dist -type f | sort
            echo '```'
            echo "CloudFront invalidation: ${{ steps.invalidate.outputs.id || 'skipped (CLOUDFRONT_DISTRIBUTION_ID not set)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
